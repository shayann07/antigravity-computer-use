name: Prepare signed release assets (no publication)
on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing release sequence
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            minimum_kernel: 10.0.19041
          - runner: macos-26
            platform: darwin
            arch: arm64
            minimum_kernel: 23.0.0
          - runner: macos-26-intel
            platform: darwin
            arch: x64
            minimum_kernel: 23.0.0
    runs-on: ${{ matrix.runner }}
    # The signing key is only available after the maintainer approves the
    # protected release environment, which is limited to main.
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Check provenance
        run: node scripts/check-provenance.mjs
      - name: Verify release asset validation regressions
        run: node --test tests/signed-assets.test.mjs
      - name: Build package-backed Windows LiquidGlass companion
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.403
      - name: Publish package-backed Windows LiquidGlass companion
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet publish server/liquidglass-host/LiquidGlass.Host.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -o .localdata/liquidglass-publish
      - name: Verify package-backed Windows HUD client
        if: runner.os == 'Windows'
        env:
          AGCU_LIQUIDGLASS_HELPER_BUILD: ${{ github.workspace }}/.localdata/liquidglass-publish
        run: node --test tests/liquidglass-client.test.mjs
      # The Mac helper is signed with the owner's long-lived certificate so
      # macOS keeps users' Accessibility, Screen Recording and Input
      # Monitoring grants across updates. Fails closed without the secret.
      - name: Load the owner's Mac helper signing certificate
        if: runner.os == 'macOS'
        env:
          AGCU_MAC_HELPER_P12: ${{ secrets.AGCU_MAC_HELPER_P12 }}
          AGCU_MAC_HELPER_P12_PASSWORD: ${{ secrets.AGCU_MAC_HELPER_P12_PASSWORD }}
          AGCU_MAC_HELPER_SHA1: ${{ vars.AGCU_MAC_HELPER_SHA1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AGCU_MAC_HELPER_P12" ] || [ -z "$AGCU_MAC_HELPER_P12_PASSWORD" ] || [ -z "$AGCU_MAC_HELPER_SHA1" ]; then
            echo "The release environment has no Mac helper signing certificate; refusing an ad-hoc release." >&2; exit 1
          fi
          umask 077
          printf '%s' "$AGCU_MAC_HELPER_P12" | base64 --decode > "$RUNNER_TEMP/helper-signing.p12"
          keychain="$RUNNER_TEMP/agcu-helper-signing.keychain-db"
          node scripts/macos-signing-keychain.mjs create "$keychain" "$RUNNER_TEMP/helper-signing.p12" "$AGCU_MAC_HELPER_SHA1"
          rm -f "$RUNNER_TEMP/helper-signing.p12"
          # codesign resolves identities only from keychains on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "AGCU_MAC_SIGN_IDENTITY=$AGCU_MAC_HELPER_SHA1" >> "$GITHUB_ENV"
          echo "AGCU_MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build sealed bundle
        env:
          AGCU_LIQUIDGLASS_HELPER_BUILD: ${{ runner.os == 'Windows' && format('{0}/.localdata/liquidglass-publish', github.workspace) || '' }}
        run: node scripts/bundle.mjs --output .localdata/release-bundle
      - name: Sign published-update metadata and prepare payload assets
        env:
          AGCU_RELEASE_SIGNING_KEY: ${{ secrets.AGCU_RELEASE_SIGNING_KEY }}
          RELEASE_SEQUENCE: ${{ inputs.sequence || github.run_id }}
          MINIMUM_KERNEL: ${{ matrix.minimum_kernel }}
        shell: bash
        run: node scripts/sign-update-ci.mjs .localdata/release-bundle "$RELEASE_SEQUENCE" "$MINIMUM_KERNEL" .localdata/signed-release
      - name: Independently verify public signature and prepared payloads
        run: node scripts/verify-signed-assets.mjs .localdata/release-bundle .localdata/signed-release
      - name: Qualify the exact signed Mac bundle with native services
        if: runner.os == 'macOS'
        run: node scripts/macos-install-check.mjs .localdata/release-bundle
      - name: Qualify the exact signed Windows bundle or record ACL refusal
        if: runner.os == 'Windows'
        run: node scripts/windows-install-check.mjs .localdata/release-bundle
      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: node scripts/macos-signing-keychain.mjs delete "$RUNNER_TEMP/agcu-helper-signing.keychain-db"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: .localdata/signed-release/
          retention-days: 7
      # Publication and installer pins require the separately recorded native,
      # real-app, physical-input and release-transport acceptance gates.
